name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unhosted tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run full unhosted suite
        run: |
          xcodegen generate
          xcodebuild -quiet \
            -project ZBSEye.xcodeproj \
            -scheme ZBSEyeUnitTests \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ZBSEyeDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ZBSEyeUnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build full GUI target
        run: |
          xcodebuild -quiet \
            -project ZBSEye.xcodeproj \
            -scheme ZBSEye \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ZBSEyeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Call fixture contract
        env:
          ZBS_EYE_CALL_DERIVED_DATA_PATH: ${{ runner.temp }}/ZBSEyeDerivedData
        run: bash scripts/verify-call-recording.sh --fixtures

      - name: Validate capture coexistence protocol
        run: bash scripts/verify-capture-coexistence.sh --self-test

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZBSEyeUnitTests-${{ github.run_id }}
          path: ${{ runner.temp }}/ZBSEyeUnitTests.xcresult
          if-no-files-found: warn
          retention-days: 7
