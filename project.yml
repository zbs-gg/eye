      - path: ZBSEyeApp/Views/Settings/SettingsRoute.swift
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
      - package: GRDB
        product: GRDB
      - package: ZBSEyeVec
        product: CSqliteVec
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.zbs.eye.tests
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZBSEyeTests/Info.plist
        ZBS_EYE_MODEL_DIR: ""
