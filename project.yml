name: ZBSEye                 # internal codename of the target/scheme. Product brand — "ZBS Eye" (display name + bundle id below)
options:
  bundleIdPrefix: gg.zbs
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.26.0"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: "0.12.1"
  ZBSEyeVec:
    path: Packages/ZBSEyeVec
  Embeddings:
    url: https://github.com/jkrukowski/swift-embeddings
    from: "0.0.16"
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: "3.31.4"
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.31.4"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: "1.3.3"

schemes:
  ZBSEye:
    shared: true
    build:
      targets:
        ZBSEye: all
    test:
      targets:
        - ZBSEyeTests
  ZBSEyeUnitTests:
    shared: true
    build:
      targets:
        ZBSEyeTests: [test]
    test:
      targets:
        - ZBSEyeTests
  ScreenUnderstandingDatasetCLI:
    shared: true
    build:
      targets:
        ScreenUnderstandingDatasetCLI: all

targets:
  ZBSEye:
    type: application
    platform: macOS
    sources:
      - path: ZBSEyeApp
    dependencies:
      - package: GRDB
        product: GRDB
      - package: FlyingFox
        product: FlyingFox
      - package: MCP
        product: MCP
      - package: ZBSEyeVec
        product: CSqliteVec
      - package: Embeddings
        product: Embeddings
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.zbs.eye
        PRODUCT_NAME: "ZBS Eye"          # bundle = "ZBS Eye.app" (target/scheme — ZBSEye, no space)
        INFOPLIST_KEY_CFBundleDisplayName: "ZBS Eye"
        INFOPLIST_KEY_CFBundleName: "ZBS Eye"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.4.0"          # CFBundleShortVersionString
        CURRENT_PROJECT_VERSION: "5"        # CFBundleVersion
        CODE_SIGN_ENTITLEMENTS: ZBSEyeApp/ZBSEye.entitlements
        # Default — ad-hoc for development. scripts/build-release.sh can use the legacy self-signed
        # "ZBS Eye Dev" identity; distributable releases must use scripts/build-notarized.sh with the
        # configured Developer ID certificate. A stable identity preserves TCC permissions and Keychain ACLs.
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "ZBS Eye reads the screen for your activity history and timeline, and (if enabled in settings) records system audio — calls, meetings, videos — to make conversations searchable. Everything stays on your device."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ZBS Eye records and transcribes audio locally, to make conversations searchable."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "ZBS Eye recognizes speech on-device to make audio searchable."
        INFOPLIST_KEY_LSUIElement: "NO"
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"

  # Headless research tool. It shares no sources or linkage with the shipping app target.
  ScreenUnderstandingDatasetCLI:
    type: tool
    platform: macOS
    sources:
      - path: tools/screen-understanding-bench/dataset/ScreenUnderstandingDatasetSupport.swift
      - path: tools/screen-understanding-bench/dataset/ScreenUnderstandingDatasetCommand.swift
      - path: tools/screen-understanding-bench/dataset/main.swift
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.zbs.eye.screen-understanding-dataset-cli
        PRODUCT_NAME: ScreenUnderstandingDatasetCLI
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES

  # Unhosted by design: a hosted macOS unit-test bundle would launch an ad-hoc
  # gg.zbs.eye build and can invalidate the installed app's TCC grants. Pure
  # production files are shared into this target explicitly as their tests land.
  ZBSEyeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZBSEyeTests
        excludes:
          - Info.plist
      - path: tools/screen-understanding-bench/dataset/ScreenUnderstandingDatasetSupport.swift
      - path: tools/screen-understanding-bench/dataset/ScreenUnderstandingDatasetCommand.swift
      - path: ZBSEyeApp/Connections/AIProvider.swift
      - path: ZBSEyeApp/Connections/AIProviderStore.swift
      - path: ZBSEyeApp/Connections/AIProviderRoutingBridge.swift
      - path: ZBSEyeApp/Connections/AIContracts.swift
      - path: ZBSEyeApp/Connections/AIConsumerGeneration.swift
      - path: ZBSEyeApp/Connections/LocalAIContextPolicy.swift
      - path: ZBSEyeApp/Connections/LocalAIOutputContract.swift
      - path: ZBSEyeApp/Connections/LocalAIAnswerToolContract.swift
      - path: ZBSEyeApp/Connections/BuiltInModelManifest.swift
      - path: ZBSEyeApp/Connections/BuiltInModelVerifier.swift
      - path: ZBSEyeApp/Connections/BuiltInModelLifecycle.swift
      - path: ZBSEyeApp/Connections/BuiltInModelJournal.swift
      - path: ZBSEyeApp/Connections/BuiltInDownloadClient.swift
      - path: ZBSEyeApp/Connections/BuiltInModelManager.swift
      - path: ZBSEyeApp/Connections/BuiltInModelProcessLock.swift
      - path: ZBSEyeApp/Connections/BuiltInModelFailureMessage.swift
