        ZBS_EYE_SWIFT_COMPILER_VERSION: ""
        ZBS_EYE_XCODE_VERSION: ""
        ZBS_EYE_SDK_VERSION: ""
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
        ZBS_EYE_ALLOW_MODEL_DOWNLOADS: "0"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
