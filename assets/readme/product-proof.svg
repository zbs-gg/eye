<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="590" viewBox="0 0 1200 590"
     role="img" aria-labelledby="title desc">
  <title id="title">One local record, three useful ZBS Eye surfaces</title>
  <desc id="desc">A synthetic, non-personal product example showing Timeline, Calls, and local agent evidence.</desc>

  <rect width="1200" height="590" rx="28" fill="#F4F6F8"/>
  <rect x="1" y="1" width="1198" height="588" rx="27" fill="none" stroke="#CDD3DB" stroke-width="2"/>
  <text x="54" y="55" fill="#596270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" letter-spacing="1">SYNTHETIC PRODUCT PROOF · NO PERSONAL DATA</text>
  <text x="54" y="101" fill="#101318" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="38" font-weight="750">One local record. Three useful surfaces.</text>

  <g id="timeline" transform="translate(54 136)">
    <rect width="522" height="392" rx="20" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="2"/>
    <text x="28" y="43" fill="#101318" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="25" font-weight="700">Timeline</text>
    <text x="28" y="72" fill="#6B7480" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">screen · text · audio · calls</text>

    <rect x="28" y="97" width="466" height="178" rx="14" fill="#EAF0FA"/>
    <rect x="48" y="118" width="276" height="15" rx="7" fill="#C6D8F5"/>
    <rect x="48" y="145" width="397" height="15" rx="7" fill="#D7E2F3"/>
    <rect x="48" y="172" width="348" height="15" rx="7" fill="#D7E2F3"/>
    <rect x="48" y="214" width="185" height="35" rx="8" fill="#FFFFFF"/>
    <text x="63" y="237" fill="#4A5666" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">Design document</text>

    <g transform="translate(28 304)">
      <text x="0" y="18" fill="#6B7480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">09:00</text>
      <text x="408" y="18" fill="#6B7480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">12:00</text>
      <line x1="0" y1="45" x2="466" y2="45" stroke="#C8CED7" stroke-width="6" stroke-linecap="round"/>
      <rect x="20" y="39" width="82" height="12" rx="6" fill="#5B8CFF"/>
      <rect x="126" y="39" width="67" height="12" rx="6" fill="#5B8CFF"/>
      <rect x="215" y="37" width="138" height="16" rx="8" fill="#9B7BFF"/>
      <rect x="376" y="39" width="62" height="12" rx="6" fill="#5B8CFF"/>
      <circle cx="286" cy="45" r="8" fill="#FF9F43"/>
      <text x="0" y="82" fill="#6B7480" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="18">scrub any moment · bookmark the useful ones</text>
    </g>
  </g>

  <g id="calls" transform="translate(600 136)">
    <rect width="546" height="190" rx="20" fill="#101318"/>
    <text x="26" y="42" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="25" font-weight="700">Calls</text>
    <text x="456" y="42" fill="#A2AAB5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18">38:12</text>

    <text x="26" y="87" fill="#A2AAB5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">You</text>
    <rect x="104" y="74" width="390" height="13" rx="6" fill="#252B34"/>
    <rect x="104" y="74" width="82" height="13" rx="6" fill="#5B8CFF"/>
    <rect x="215" y="74" width="112" height="13" rx="6" fill="#5B8CFF"/>
    <rect x="408" y="74" width="62" height="13" rx="6" fill="#5B8CFF"/>

    <text x="26" y="124" fill="#A2AAB5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">Speaker 2</text>
    <rect x="130" y="111" width="364" height="13" rx="6" fill="#252B34"/>
    <rect x="130" y="111" width="134" height="13" rx="6" fill="#FF9F43"/>
    <rect x="294" y="111" width="77" height="13" rx="6" fill="#FF9F43"/>
    <rect x="395" y="111" width="99" height="13" rx="6" fill="#FF9F43"/>

    <rect x="26" y="145" width="183" height="29" rx="14" fill="#28213C"/>
    <text x="42" y="165" fill="#DCCFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">◆ bookmark · 23:04</text>
  </g>

  <g id="agents" transform="translate(600 350)">
    <rect width="546" height="178" rx="20" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="2"/>
    <text x="26" y="42" fill="#101318" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="25" font-weight="700">Local agent evidence</text>
    <rect x="26" y="62" width="494" height="43" rx="11" fill="#EEF2F7"/>
    <text x="43" y="89" fill="#394352" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">What did we decide about launch?</text>
    <circle cx="38" cy="137" r="7" fill="#34C759"/>
    <text x="56" y="143" fill="#394352" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18">10:31 · Keep the first release small and local.</text>
  </g>
</svg>
